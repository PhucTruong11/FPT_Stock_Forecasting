<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
<title id="title">FPT research and local inference pipeline</title>
<desc id="desc">Versioned FPT data is validated, used for causal features and temporal evaluation. A selected Ridge bundle feeds FastAPI and Streamlit. Historical evidence stays separate.</desc>
<rect width="1200" height="260" rx="20" fill="#0f172a"/>
<g font-family="Arial,sans-serif" fill="#e2e8f0"><text x="35" y="40" font-size="23" font-weight="bold">FPT · Research → local prediction</text><text x="35" y="68" font-size="14" fill="#94a3b8">One ticker · supervised regression · next eligible observation · no automatic retraining</text></g>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker></defs>
<g fill="#1e293b" stroke="#475569"><rect x="30" y="105" width="175" height="83" rx="12"/><rect x="230" y="105" width="175" height="83" rx="12"/><rect x="430" y="105" width="175" height="83" rx="12"/><rect x="630" y="105" width="175" height="83" rx="12"/><rect x="830" y="105" width="145" height="83" rx="12"/><rect x="1000" y="105" width="170" height="83" rx="12"/></g>
<g stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"><path d="M205 146 H224"/><path d="M405 146 H424"/><path d="M605 146 H624"/><path d="M805 146 H824"/><path d="M975 146 H994"/></g>
<g fill="#f8fafc" font-family="Arial,sans-serif" font-size="17" text-anchor="middle"><text x="117" y="138">FPT OHLCV</text><text x="317" y="138">Validate / features</text><text x="517" y="138">Temporal research</text><text x="717" y="138">Ridge6 bundle</text><text x="902" y="138">FastAPI</text><text x="1085" y="138">Streamlit</text></g>
<g fill="#94a3b8" font-family="Arial,sans-serif" font-size="12" text-anchor="middle"><text x="117" y="164">Vietcap snapshot + hash</text><text x="317" y="164">No future information</text><text x="517" y="164">Baselines + evidence</text><text x="717" y="164">Scaler + fixed bias</text><text x="902" y="164">JSON · local</text><text x="1085" y="164">Forecast / backtest</text></g>
<text x="35" y="228" font-family="Arial,sans-serif" font-size="14" fill="#5eead4">Historical scores ≠ performance of the newly updated bundle. Public deployment remains a future plan.</text>
</svg>
